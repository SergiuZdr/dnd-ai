</div>
<script>
(function () {
  'use strict';

  var PIN_KEY = 'dnd-web-pin';
  var STAT_ORDER = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
  var ROLL_DIE_RADIUS = 58;

  var els = {
    app: document.getElementById('app'),
    pinScreen: document.getElementById('screen-pin'),
    campaignsScreen: document.getElementById('screen-campaigns'),
    wizardScreen: document.getElementById('screen-wizard'),
    playScreen: document.getElementById('screen-play'),
    pinInput: document.getElementById('pin-input'),
    pinSubtitle: document.getElementById('pin-subtitle'),
    pinSubmit: document.getElementById('pin-submit'),
    pinError: document.getElementById('pin-error'),
    campaignList: document.getElementById('campaign-list'),
    campaignCount: document.getElementById('campaign-count'),
    signoutBtn: document.getElementById('signout-btn'),
    campaignListLabel: document.getElementById('campaign-list-label'),
    newCampaignBtn: document.getElementById('new-campaign-btn'),
    topbarToggle: document.getElementById('topbar-toggle'),
    tbInitial: document.getElementById('tb-initial'),
    tbSigil: document.getElementById('tb-sigil'),
    tbName: document.getElementById('tb-name'),
    tbSubtitle: document.getElementById('tb-subtitle'),
    tbHpFill: document.getElementById('tb-hpfill'),
    tbHp: document.getElementById('tb-hp'),
    tbAc: document.getElementById('tb-ac'),
    tbGold: document.getElementById('tb-gold'),
    tbLuck: document.getElementById('tb-luck'),
    tbXp: document.getElementById('tb-xp'),
    hudBody: document.getElementById('hud-body'),
    drawer: document.getElementById('drawer'),
    reconnectPill: document.getElementById('reconnect-pill'),
    feed: document.getElementById('feed'),
    diceLine: document.getElementById('dice-line'),
    slashBtn: document.getElementById('slash-btn'),
    slashMenu: document.getElementById('slash-menu'),
    retireBtn: document.getElementById('retire-btn'),
    textInput: document.getElementById('text-input'),
    sendBtn: document.getElementById('send-btn'),
    stopBtn: document.getElementById('stop-btn'),
    rollBackdrop: document.getElementById('roll-backdrop'),
    rollSheet: document.getElementById('roll-sheet'),
    transitionOverlay: document.getElementById('transition-overlay'),
    transitionText: document.getElementById('transition-text'),
    wizardProgressFill: document.getElementById('wizard-progress-fill'),
    wizardStepLabel: document.getElementById('wizard-step-label'),
    wizardCancelBtn: document.getElementById('wizard-cancel-btn'),
    wizardBody: document.getElementById('wizard-body'),
    wizardError: document.getElementById('wizard-error'),
    wizardBackBtn: document.getElementById('wizard-back-btn'),
    wizardNextBtn: document.getElementById('wizard-next-btn'),
  };

  var pin = localStorage.getItem(PIN_KEY) || '';
  /**
   * 'pin' | 'code' -- set by applyAuthMode() from GET /api/auth-mode; affects
   * wording, the input's shape, and whether keystrokes are sanitised to digits,
   * never how the credential is sent.
   *
   * Defaults to 'code' (the permissive one) so every path fails OPEN: until the
   * server confirms PIN mode, letters and dashes are accepted. A 'pin' default
   * meant that a slow or failed /api/auth-mode left the digits-only sanitiser
   * armed, silently eating an access code as it was typed. A PIN typed into a
   * permissive field is still a valid PIN; a code typed into a digits-only
   * field is unrecoverable.
   */
  var authMode = 'code';
  var currentScreen = null;
  var session = null; // last 'hello' snapshot, kept up to date by every subsequent event
  var partial = '';
  var evtSource = null;
  var sseRetryTimer = null;
  var sseRetryMs = 1000; // grows on repeated failures, reset on a healthy 'open'
  var drawerOpen = false;
  var rollUi = { phase: 'idle', reveal: null }; // 'idle' | 'waiting' | 'rolling' | 'revealed'
  var localNoteCounter = 0; // client-only ids for 'note' events, mirrors the server's own negative-id scheme
  var presetsCache = null;
  var wizard = null; // active campaign/retire wizard state, or null when not in the wizard

  // ---------------------------------------------------------------- utils

  function sleep(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }

  function reducedMotion() {
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function showScreen(name) {
    currentScreen = name;
    // Published on #app so CSS can vary the frame per screen -- see the
    // .frame-corner rules, which hide the corner ornaments on screens whose
    // chrome reaches the frame edge.
    els.app.dataset.screen = name;
    els.pinScreen.classList.toggle('hidden', name !== 'pin');
    els.campaignsScreen.classList.toggle('hidden', name !== 'campaigns');
    els.wizardScreen.classList.toggle('hidden', name !== 'wizard');
    els.playScreen.classList.toggle('hidden', name !== 'play');
  }

  /** Every request except GET / goes through here: attaches the PIN header, and on 401 clears the stored PIN and bounces to the PIN screen (never assumes success past that point -- callers should stop on a thrown error). */
  function apiFetch(path, options) {
    options = options || {};
    var headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
    headers['X-Game-Pin'] = pin;
    return fetch(path, Object.assign({}, options, { headers: headers })).then(function (res) {
      if (res.status === 401) {
        localStorage.removeItem(PIN_KEY);
        pin = '';
        showScreen('pin');
        els.pinError.textContent =
          authMode === 'code' ? 'That access code was not accepted — check it and try again.' : 'Wrong PIN — try again.';
        throw new Error('unauthorized');
      }
      return res;
    });
  }

  function postJson(path, body) {
    return apiFetch(path, { method: 'POST', body: JSON.stringify(body || {}) }).then(function (res) {
      return res.json();
    });
  }

  // ---------------------------------------------------------------- PIN screen

  // Sanitising to digits is correct for a 6-digit PIN and fatal for an access
  // code: this stripped every letter and dash on each keystroke, so
  // "bad3-115a-..." became "311505" and no code could ever be entered --
  // regardless of the input's inputmode/pattern/maxlength, which is why
  // relaxing those attributes alone did nothing. Only enforce it in PIN mode.
  els.pinInput.addEventListener('input', function () {
    if (authMode !== 'pin') return;
    els.pinInput.value = els.pinInput.value.replace(/\D/g, '').slice(0, 6);
  });
  els.pinInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') submitPin();
  });
  els.pinSubmit.addEventListener('click', submitPin);

  function submitPin() {
    var candidate = els.pinInput.value.trim();
    if (candidate.length === 0) return;
    pin = candidate;
    els.pinError.textContent = '';
    apiFetch('/api/campaigns')
      .then(function (res) {
        if (!res.ok) throw new Error('unexpected');
        localStorage.setItem(PIN_KEY, pin);
        return res.json();
      })
      .then(function (list) {
        // showScreen must happen HERE, explicitly: the SSE hello handler
        // deliberately never navigates away from the PIN screen, so without
        // this line a correct PIN validated fine server-side while the page
        // stayed frozen on the PIN screen (the launch-day phone bug).
        showScreen('campaigns');
        renderCampaignList(list);
        connectSse();
      })
      .catch(function () {
        // apiFetch already redirected to the PIN screen with an error on 401;
        // anything else, leave the field as-is so the player can retry.
      });
  }

  // ---------------------------------------------------------------- campaigns screen

  /** The crest markup is shared with the play-screen HUD; built here rather
   * than cloned so the picker doesn't depend on the play screen being live. */
  function crestNode(name, className, extraClass) {
    var crest = el('div', 'hud-crest' + (extraClass ? ' ' + extraClass : ''));
    crest.innerHTML = '<svg class="crest-frame" viewBox="0 0 100 100" aria-hidden="true">' +
      '<circle cx="50" cy="50" r="44" fill="none" stroke="#ad7f3a" stroke-width="2"/>' +
      '<circle cx="50" cy="50" r="37" fill="none" stroke="#eec877" stroke-width="1" opacity="0.55"/>' +
      '<path d="M50 4 L54 12 L46 12 Z" fill="#eec877" opacity="0.85"/>' +
      '<path d="M50 96 L54 88 L46 88 Z" fill="#eec877" opacity="0.85"/>' +
      '<path d="M4 50 L12 54 L12 46 Z" fill="#eec877" opacity="0.85"/>' +
      '<path d="M96 50 L88 54 L88 46 Z" fill="#eec877" opacity="0.85"/></svg>';
    crest.appendChild(el('span', 'crest-initial', (name || '?').trim().charAt(0).toUpperCase() || '?'));
    var sigil = el('span', 'crest-sigil', classSigil(className));
    sigil.setAttribute('aria-hidden', 'true');
    crest.appendChild(sigil);
    return crest;
  }

  /**
   * Forgets the stored credential and returns to the login screen so a
   * different player can sign in on the same device -- there was previously no
   * way out of an account at all short of clearing site data by hand.
   *
   * Deliberately does NOT end the server-side session: signing out is a client
   * act, and killing a live game because someone handed the phone over would
   * lose the turn in flight. The session stays exactly as it would if the tab
   * were closed, and signing back in resumes it.
   */
  function signOut() {
    if (sseRetryTimer) { clearTimeout(sseRetryTimer); sseRetryTimer = null; }
    if (evtSource) { evtSource.close(); evtSource = null; }
    localStorage.removeItem(PIN_KEY);
    pin = '';
    session = null;
    partial = '';
    els.feed.innerHTML = '';
    els.campaignList.innerHTML = '';
    els.pinInput.value = '';
    els.pinError.textContent = '';
    showScreen('pin');
  }
  els.signoutBtn.addEventListener('click', signOut);

  /** Swaps a campaign card for an inline confirmation, so the campaign being destroyed stays named and on screen while the player decides. */
  function confirmDeleteCampaign(slot, campaign) {
    var confirmBox = el('div', 'card-confirm');
    confirmBox.appendChild(el('div', 'confirm-q', 'Delete "' + campaign.name + '"?'));
    confirmBox.appendChild(el('div', 'confirm-note', 'The hero, the world and the whole story log go with it.'));

    var actions = el('div', 'confirm-actions');
    var yes = el('button', 'confirm-yes', 'Delete');
    yes.type = 'button';
    var no = el('button', 'confirm-no', 'Keep');
    no.type = 'button';

    no.addEventListener('click', function () { loadCampaigns(); });
    yes.addEventListener('click', function () {
      yes.disabled = true;
      yes.textContent = 'Deleting…';
      postJson('/api/campaign/delete', { slug: campaign.slug })
        .catch(function () { return null; })
        .then(function () { loadCampaigns(); });
    });

    actions.appendChild(yes);
    actions.appendChild(no);
    confirmBox.appendChild(actions);
    slot.innerHTML = '';
    slot.appendChild(confirmBox);
  }

  function renderCampaignList(list) {
    els.campaignList.innerHTML = '';
    var count = (list && list.length) || 0;
    els.campaignCount.textContent = count === 0 ? '' : count === 1 ? '1 world' : count + ' worlds';
    // Only meaningful when a credential identifies a person; in single-player
    // PIN mode there is no other account to switch to.
    els.signoutBtn.classList.toggle('hidden', authMode !== 'code');
    // The "Continue" rule is a heading for the list below it, so it has nothing
    // to head when there is no list.
    els.campaignListLabel.classList.toggle('hidden', count === 0);
    if (count === 0) {
      els.campaignList.appendChild(el('div', 'empty-note', 'No campaigns yet. Begin one above and the world starts the moment you name it.'));
      return;
    }
    list.forEach(function (c) {
      var card = el('button', 'campaign-card');
      var hero = c.hero;
      card.appendChild(crestNode(hero && hero.name, hero && hero.className, 'card-crest'));

      var body = el('div', 'card-body');
      body.appendChild(el('div', 'name', c.name));
      if (hero) {
        body.appendChild(el('div', 'hero-line', hero.name + ' — ' + hero.race + ' ' + hero.className + ', Level ' + hero.level));
        body.appendChild(el('div', 'meta', hero.location + ' · ' + relativeTime(c.updatedAt)));
        var ratio = hero.maxHp > 0 ? Math.max(0, Math.min(1, hero.hp / hero.maxHp)) : 0;
        var hpRow = el('div', 'card-hp');
        var track = el('div', 'stat-track');
        var fill = el('div', 'stat-fill');
        fill.style.width = Math.round(ratio * 100) + '%';
        fill.style.background = hpColor(ratio);
        track.appendChild(fill);
        hpRow.appendChild(track);
        hpRow.appendChild(el('span', 'stat-value', hero.hp + '/' + hero.maxHp + ' HP'));
        body.appendChild(hpRow);
      } else {
        body.appendChild(el('div', 'meta', 'Updated ' + relativeTime(c.updatedAt)));
      }
      card.appendChild(body);

      card.addEventListener('click', function () { continueCampaign(c.slug); });

      var slot = el('div', 'campaign-slot');
      slot.appendChild(card);

      var del = el('button', 'card-delete', '✕');
      del.type = 'button';
      del.setAttribute('aria-label', 'Delete ' + c.name);
      del.addEventListener('click', function (e) {
        e.stopPropagation(); // never let the delete tap fall through to "open campaign"
        confirmDeleteCampaign(slot, c);
      });
      slot.appendChild(del);

      els.campaignList.appendChild(slot);
    });
  }

  function relativeTime(iso) {
    var diffMs = Date.now() - new Date(iso).getTime();
    var mins = Math.round(diffMs / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    var hours = Math.round(mins / 60);
    if (hours < 24) return hours + 'h ago';
    return Math.round(hours / 24) + 'd ago';
  }

  function continueCampaign(slug) {
    postJson('/api/continue', { slug: slug })
      .catch(function () { return null; }) // network error -> body null, handled below
      .then(function (body) {
        // 409 ("session already running") resolves with an error body too --
        // attaching to the live session via SSE is exactly right, so it still
        // goes to the play screen. Any OTHER error (load failure, bad slug,
        // server down) stays on the campaign list instead of dumping the
        // player on a dead, empty play screen.
        var alreadyRunning = body && body.error === 'session already running';
        if (body && !body.error) { showScreen('play'); return; }
        if (alreadyRunning) { showScreen('play'); return; }
        console.error('continue failed:', body ? body.error : 'network error');
      });
  }

  function loadCampaigns() {
    apiFetch('/api/campaigns')
      .then(function (res) { return res.json(); })
      .then(renderCampaignList)
      .catch(function () {});
  }

  els.newCampaignBtn.addEventListener('click', function () { openWizard('new'); });

  // ---------------------------------------------------------------- SSE

  /**
   * Opens the event stream using a single-use ticket rather than putting the
   * real credential in the URL, because query strings leak into proxy access
   * logs, tunnel logs, browser history and Referer headers. EventSource can't
   * send headers, so the exchange is: POST /api/sse-ticket with the normal
   * credential header, then spend the one-shot ticket on the stream URL.
   *
   * Falls back to `?pin=` if the ticket request fails, so an older server (or a
   * transient blip) still yields a working stream instead of a dead page.
   */
  function connectSse() {
    if (sseRetryTimer) { clearTimeout(sseRetryTimer); sseRetryTimer = null; }
    if (evtSource) { evtSource.close(); evtSource = null; }
    apiFetch('/api/sse-ticket', { method: 'POST', body: '{}' })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (body) {
        openEventStream(body && body.ticket ? 'ticket=' + encodeURIComponent(body.ticket) : 'pin=' + encodeURIComponent(pin));
      })
      .catch(function () {
        // A 401 has already bounced us to the login screen and cleared `pin`;
        // retrying then would spin against a credential we know is dead.
        if (pin) scheduleSseReconnect();
      });
  }

  /**
   * Reconnect is ours now, not EventSource's. Its built-in retry re-requests the
   * SAME url, and the ticket in that url is single-use -- so after the first
   * drop (a screen lock, a carrier blip, exactly what this game does all day on
   * a phone) its automatic retries would 401 forever and the stream would be
   * quietly dead. Each attempt has to go get a fresh ticket, so we close the
   * source ourselves and come back through connectSse() with a backoff.
   */
  function scheduleSseReconnect() {
    if (sseRetryTimer) return;
    sseRetryTimer = setTimeout(function () {
      sseRetryTimer = null;
      connectSse();
    }, sseRetryMs);
    sseRetryMs = Math.min(sseRetryMs * 2, 15000);
  }

  function openEventStream(query) {
    if (evtSource) evtSource.close();
    evtSource = new EventSource('/api/events?' + query);

    evtSource.addEventListener('open', function () {
      els.reconnectPill.classList.add('hidden');
      sseRetryMs = 1000; // healthy again -- forget the accumulated backoff
    });
    evtSource.onerror = function () {
      els.reconnectPill.classList.remove('hidden');
      if (evtSource) { evtSource.close(); evtSource = null; }
      scheduleSseReconnect();
    };

    evtSource.addEventListener('hello', function (e) {
      hideTransitionOverlay();
      session = JSON.parse(e.data);
      partial = '';
      resetLedgerAcc();
      clearAutoDismiss();
      rollUi = { phase: session.pendingRoll ? 'waiting' : 'idle', reveal: null };
      if (session.campaign) {
        showScreen('play');
      } else if (currentScreen !== 'pin' && currentScreen !== 'wizard') {
        // Never yank the player out of an in-progress campaign/retire wizard
        // just because a stray hello (e.g. a reconnect) reports no campaign
        // yet -- only an explicit cancel or a successful submission should
        // leave that screen.
        showScreen('campaigns');
        loadCampaigns();
      }
      renderFeed(true);
      renderTopbar();
      renderDiceLine();
      renderRollSheet();
      renderInputState();
    });

    evtSource.addEventListener('story', function (e) {
      var entry = JSON.parse(e.data);
      session.entries.push(entry);
      appendFeedEntry(entry);
      autoScroll(entry.kind === 'player');
    });

    evtSource.addEventListener('replay', function (e) {
      var data = JSON.parse(e.data);
      session.entries = session.entries.concat(data.entries);
      renderFeed(true);
    });

    evtSource.addEventListener('stream', function (e) {
      var data = JSON.parse(e.data);
      var wasEmpty = partial.length === 0;
      partial = data.text;
      renderStreamingBubble();
      if (wasEmpty && partial.length > 0) autoScroll(true);
      else autoScroll(false);
    });

    evtSource.addEventListener('state', function (e) {
      session.state = JSON.parse(e.data);
      renderTopbar();
    });

    evtSource.addEventListener('dice', function (e) {
      session.diceMessage = JSON.parse(e.data).message;
      renderDiceLine();
    });

    evtSource.addEventListener('busy', function (e) {
      var next = !!JSON.parse(e.data).busy;
      var prev = !!(session && session.busy);
      session.busy = next;
      if (!prev && next) resetLedgerAcc(); // new turn starting -- nothing should bleed in
      if (prev && !next) flushLedgerToast(); // turn just finished -- show what landed
      renderInputState();
    });

    evtSource.addEventListener('note', function (e) {
      var text = JSON.parse(e.data).text;
      localNoteCounter -= 1;
      appendFeedEntry({ id: 'note-' + localNoteCounter, kind: 'system', text: text });
      autoScroll(false);
    });

    // Loot/ledger deltas (gold, xp, items) accumulate silently here while the
    // turn is in flight; flushLedgerToast() (called from the busy handler
    // above) is what actually renders the combined "YOU GAINED" toast.
    evtSource.addEventListener('ledger', function (e) {
      var delta = JSON.parse(e.data);
      if (!ledgerAcc) resetLedgerAcc();
      if (typeof delta.gold === 'number') ledgerAcc.gold += delta.gold;
      if (typeof delta.xp === 'number') ledgerAcc.xp += delta.xp;
      if (delta.leveledTo) ledgerAcc.leveledTo = delta.leveledTo;
      (delta.itemsAdded || []).forEach(function (it) {
        ledgerAcc.itemsAdded[it.name] = (ledgerAcc.itemsAdded[it.name] || 0) + it.qty;
      });
      (delta.itemsRemoved || []).forEach(function (it) {
        ledgerAcc.itemsRemoved[it.name] = (ledgerAcc.itemsRemoved[it.name] || 0) + it.qty;
      });
    });

    // NOTE on ordering: confirmRoll()/resolvePendingRoll() broadcast this
    // event (data: null) SYNCHRONOUSLY as part of resolving the roll --
    // which can race ahead of, or arrive right alongside, the POST response
    // that carries the actual reveal (onRollTap/onLuckChoice below). This
    // handler must never let that race yank the sheet away before the
    // player has had a chance to read a reveal that's either already
    // showing or about to be shown by that POST's own .then(). See
    // showRevealed()/scheduleAutoDismiss() for the other half of this.
    evtSource.addEventListener('roll', function (e) {
      var request = JSON.parse(e.data);
      session.pendingRoll = request;
      if (request) {
        clearAutoDismiss();
        rollUi = { phase: 'waiting', reveal: null };
        renderRollSheet();
      } else if (rollUi.phase === 'rolling') {
        // Mid-animation, no reveal shown yet -- do nothing here. The local
        // spin/POST chain in onRollTap or onLuckChoice will call
        // showRevealed() itself once it lands, and THAT will notice
        // pendingRoll is already null and schedule the dismiss then.
      } else if (rollUi.phase === 'revealed') {
        scheduleAutoDismiss();
      } else {
        // Nothing was ever shown locally for this roll (e.g. another device
        // resolved it, or the session errored/interrupted before the
        // player even tapped ROLL) -- nothing to linger on.
        clearAutoDismiss();
        rollUi = { phase: 'idle', reveal: null };
        renderRollSheet();
      }
      renderInputState();
    });
  }

  var autoDismissTimer = null;
  var AUTO_DISMISS_MS = 1600;

  function clearAutoDismiss() {
    if (autoDismissTimer) {
      clearTimeout(autoDismissTimer);
      autoDismissTimer = null;
    }
  }

  /** Lets an already-rendered reveal stay on screen briefly before the sheet closes on its own -- see the 'roll' SSE handler above for why this exists instead of closing immediately. */
  function scheduleAutoDismiss() {
    clearAutoDismiss();
    autoDismissTimer = setTimeout(function () {
      autoDismissTimer = null;
      if (!session.pendingRoll) {
        rollUi = { phase: 'idle', reveal: null };
        renderRollSheet();
      }
    }, AUTO_DISMISS_MS);
  }

  /** Single path for both onRollTap and onLuckChoice to show a reveal from a POST response -- keeps the "schedule a dismiss once we know the server has already resolved" logic in one place. */
  function showRevealed(reveal) {
    if (!reveal) {
      // The server had nothing to reveal (e.g. the roll was aborted from
      // under us while the local animation/request was in flight) -- there
      // is nothing to show, so don't leave a blank sheet lingering.
      rollUi = { phase: 'idle', reveal: null };
      renderRollSheet();
      return;
    }
    rollUi = { phase: 'revealed', reveal: reveal };
    renderRollSheet();
    if (!session.pendingRoll) scheduleAutoDismiss();
  }

  // ---------------------------------------------------------------- loot ledger toasts

  var ledgerAcc = null;

  function resetLedgerAcc() {
    ledgerAcc = { gold: 0, xp: 0, leveledTo: null, itemsAdded: {}, itemsRemoved: {} };
  }
  resetLedgerAcc();

  function flushLedgerToast() {
    if (!ledgerAcc) return;
    var acc = ledgerAcc;
    resetLedgerAcc();

    var gains = [];
    if (acc.gold > 0) gains.push('+' + acc.gold + ' gold');
    Object.keys(acc.itemsAdded).forEach(function (name) {
      gains.push(name + ' ×' + acc.itemsAdded[name]);
    });
    if (acc.xp > 0) gains.push('+' + acc.xp + ' XP');

    var losses = [];
    if (acc.gold < 0) losses.push('spent ' + Math.abs(acc.gold) + ' gold');
    Object.keys(acc.itemsRemoved).forEach(function (name) {
      losses.push('used ' + name + ' ×' + acc.itemsRemoved[name]);
    });

    if (gains.length === 0 && losses.length === 0 && !acc.leveledTo) return;

    var node = el('div', 'entry entry-loot');
    if (gains.length) node.appendChild(el('div', 'loot-gain', '✦ YOU GAINED  ' + gains.join(' · ')));
    if (acc.leveledTo) node.appendChild(el('div', 'loot-levelup', '⟪ LEVEL ' + acc.leveledTo + ' ⟫'));
    if (losses.length) node.appendChild(el('div', 'loot-loss', losses.join(' · ')));
    els.feed.appendChild(node);
    autoScroll(true);
  }

  // ---------------------------------------------------------------- feed rendering

  function isNearBottom() {
    var f = els.feed;
    return f.scrollHeight - f.scrollTop - f.clientHeight < 100;
  }

  function autoScroll(force) {
    if (!force && !isNearBottom()) return;
    requestAnimationFrame(function () { els.feed.scrollTop = els.feed.scrollHeight; });
  }

  function entryClass(kind) {
    if (kind === 'player') return 'entry entry-player';
    if (kind === 'system') return 'entry entry-system';
    return 'entry entry-dm';
  }

  // Models narrate in light markdown whether or not you ask them to, so the
  // feed has to read `*the stone shifts*` as emphasis rather than printing the
  // asterisks. Only the two asterisk forms are honoured -- **strong** and
  // *emphasis*. `_underscore_` is deliberately NOT supported: models effectively
  // never reach for it in prose, while snake_case_words in an item or location
  // name would false-positive into italics.
  //
  // Everything is built from real DOM nodes, never innerHTML, so narration can
  // never inject markup. A marker can't span a line break, which keeps a `*`
  // used as a bullet literal; an unmatched marker (common mid-stream, when only
  // the opening `*` has arrived) is left as a literal character too. Following
  // markdown proper, the delimiters may not flank whitespace -- so `3 * 4 * 5`
  // stays arithmetic instead of italicising " 4 ".
  var INLINE_MARKUP = /\*\*([^\s*](?:[^\n*]*[^\s*])?)\*\*|\*([^\s*](?:[^\n*]*[^\s*])?)\*/;

  function appendInlineMarkup(node, text) {
    var rest = text;
    for (;;) {
      var m = INLINE_MARKUP.exec(rest);
      if (!m) break;
      if (m.index > 0) node.appendChild(document.createTextNode(rest.slice(0, m.index)));
      var strong = m[1] !== undefined;
      node.appendChild(el(strong ? 'strong' : 'em', null, strong ? m[1] : m[2]));
      rest = rest.slice(m.index + m[0].length);
    }
    if (rest) node.appendChild(document.createTextNode(rest));
  }

  function appendFeedEntry(entry) {
    var cls = entryClass(entry.kind);
    // The drop-cap styles ::first-letter -- lovely on real prose, but a scene
    // divider or markdown-ish leading character (---, *, #, a stray quote)
    // would otherwise get blown up into a giant, meaningless glyph. Suppress
    // it defensively whenever the entry doesn't open on an actual letter.
    if (cls.indexOf('entry-dm') !== -1 && !/^[\s]*[A-Za-zÀ-ɏ]/.test(entry.text)) cls += ' no-dropcap';
    var node = el('div', cls);
    if (entry.kind === 'player') {
      // Rendered as an in-world prompt line ("» did X"), not a chat bubble --
      // the arrow gets its own brass-accented span, the deed itself stays
      // plain italic text woven into the same column as the narration.
      node.appendChild(el('span', 'deed-mark', '»'));
      node.appendChild(document.createTextNode(' ' + entry.text));
    } else {
      appendInlineMarkup(node, entry.text);
    }
    node.dataset.id = String(entry.id);
    els.feed.appendChild(node);
  }

  function renderFeed(snapToBottom) {
    els.feed.innerHTML = '';
    (session.entries || []).forEach(appendFeedEntry);
    renderStreamingBubble();
    if (snapToBottom) autoScroll(true);
  }

  function renderStreamingBubble() {
    var existing = document.getElementById('streaming-bubble');
    if (existing) existing.remove();
    if (partial.length === 0) return;
    var node = el('div', 'entry entry-streaming');
    appendInlineMarkup(node, partial);
    node.id = 'streaming-bubble';
    els.feed.appendChild(node);
  }

  // ---------------------------------------------------------------- HUD (crest + vitals + sheet)

  /** Purely cosmetic class->glyph mapping for the crest's signet badge --
   * never gates game logic, just gives the monogram a class-flavored accent
   * without needing real character art. */
  function classSigil(className) {
    var s = (className || '').toLowerCase();
    if (/wizard|sorcerer|warlock|mage|artificer/.test(s)) return '✦';
    if (/cleric|priest/.test(s)) return '☼';
    if (/druid|ranger/.test(s)) return '❧';
    if (/rogue|bard|assassin|trickster/.test(s)) return '♠';
    if (/fighter|barbarian|paladin|monk|knight|warrior/.test(s)) return '⚔';
    return '❖';
  }

  /** Shared by the HUD bar and the campaign picker's bar so the two can never
   * disagree about what "wounded" looks like. */
  function hpColor(ratio) {
    return ratio > 0.5 ? 'var(--green)' : ratio > 0.25 ? 'var(--brass)' : 'var(--blood-bright)';
  }

  function renderTopbar() {
    if (!session || !session.state) return;
    var c = session.state.character;
    var ratio = c.maxHp > 0 ? Math.max(0, Math.min(1, c.hp / c.maxHp)) : 0;
    els.tbInitial.textContent = (c.name || '?').trim().charAt(0).toUpperCase() || '?';
    els.tbSigil.textContent = classSigil(c.className);
    els.tbName.textContent = c.name;
    els.tbSubtitle.textContent = c.race + ' ' + c.className + ' · Level ' + c.level + (c.background ? ' · ' + c.background : '');
    els.tbHpFill.style.width = Math.round(ratio * 100) + '%';
    els.tbHpFill.style.background = hpColor(ratio);
    els.tbHp.textContent = c.hp + '/' + c.maxHp;
    els.tbAc.textContent = String(c.ac);
    els.tbGold.textContent = String(c.gold);
    els.tbLuck.textContent = String(c.luck);
    els.tbXp.textContent = String(c.xp);
    // Always keep the sheet's *content* current, not just when open: on
    // desktop it's a persistent sidebar (forced visible by CSS regardless of
    // the mobile collapse state), so it needs real content the moment a
    // session loads, not only after the player taps to expand it on phone.
    renderDrawer();
  }

  function questRow(q) {
    var row = el('div', 'quest-item');
    row.appendChild(el('div', 'quest-title', '◆ ' + q.title));
    var rewardText = q.reward && q.reward.trim() ? q.reward : '—';
    row.appendChild(el('div', 'quest-reward-inline', 'Reward: ' + rewardText));
    return row;
  }

  function renderDrawer() {
    if (!session || !session.state) return;
    var c = session.state.character;
    var w = session.state.world;
    els.drawer.innerHTML = '';

    els.drawer.appendChild(el('h4', null, 'Ability Scores'));
    var statsGrid = el('div', 'ability-grid');
    STAT_ORDER.forEach(function (stat) {
      var tile = el('div', 'ability-tile');
      tile.appendChild(el('span', 'ability-label', stat.toUpperCase()));
      tile.appendChild(el('span', 'ability-value', String(c.stats[stat])));
      statsGrid.appendChild(tile);
    });
    els.drawer.appendChild(statsGrid);

    els.drawer.appendChild(el('h4', null, 'Inventory'));
    if (c.inventory.length === 0) {
      els.drawer.appendChild(el('div', 'hud-empty', 'Empty-handed.'));
    } else {
      var invList = el('div', 'inv-list');
      c.inventory.forEach(function (item) {
        var row = el('div', 'inv-item');
        row.appendChild(el('span', 'inv-name', item.name));
        row.appendChild(el('span', 'inv-qty', '×' + item.qty));
        invList.appendChild(row);
      });
      els.drawer.appendChild(invList);
    }

    els.drawer.appendChild(el('h4', null, 'Quests'));
    var active = w.quests.filter(function (q) { return q.status === 'active'; });
    if (active.length === 0) {
      els.drawer.appendChild(el('div', 'hud-empty', 'No open quests.'));
    } else {
      var questList = el('div', 'quest-list');
      active.forEach(function (q) { questList.appendChild(questRow(q)); });
      els.drawer.appendChild(questList);
    }

    els.drawer.appendChild(el('h4', null, 'Location'));
    els.drawer.appendChild(el('div', 'hud-location', w.location));

    var switchBtn = el('button', 'hud-switch-btn', '⇦ Switch Campaign');
    switchBtn.type = 'button';
    switchBtn.addEventListener('click', function () {
      postJson('/api/end', {}).catch(function () {}).then(function () {
        drawerOpen = false;
        els.hudBody.classList.add('hidden');
        showScreen('campaigns');
        loadCampaigns();
      });
    });
    els.drawer.appendChild(switchBtn);
  }

  function toggleDrawer() {
    drawerOpen = !drawerOpen;
    els.hudBody.classList.toggle('hidden', !drawerOpen);
    els.topbarToggle.setAttribute('aria-expanded', drawerOpen ? 'true' : 'false');
    if (drawerOpen) renderDrawer();
  }
  els.topbarToggle.addEventListener('click', toggleDrawer);
  els.topbarToggle.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleDrawer(); }
  });

  // ---------------------------------------------------------------- dice line (idle, non-interactive rolls)

  function renderDiceLine() {
    els.diceLine.textContent = (session && session.diceMessage) || '';
  }

  // ---------------------------------------------------------------- input bar

  // Stop replaces Send only once the DM turn is actually under way (busy,
  // not just a pending roll) -- while a roll card is up, Stop is hidden
  // entirely (mirrors the TUI: Esc must never interrupt a pending roll).
  function renderInputState() {
    var busy = !!(session && session.busy);
    var rolling = !!(session && session.pendingRoll);
    els.textInput.disabled = busy || rolling;
    els.sendBtn.disabled = busy || rolling;
    var showStop = busy && !rolling;
    els.stopBtn.classList.toggle('hidden', !showStop);
    els.sendBtn.classList.toggle('hidden', showStop);
  }

  function sendAction(text) {
    var trimmed = (text || '').trim();
    if (trimmed.length === 0) return;
    // No optimistic local echo: submitPlayerAction() appends the player's
    // own StoryEntry (and broadcasts it) synchronously server-side, so the
    // real 'story' event round-trips almost instantly on a LAN -- rendering
    // a local placeholder first would just risk showing the line twice.
    postJson('/api/action', { text: trimmed }).catch(function () {
      renderInputState(); // resync to the last known state if the request itself failed
    });
  }

  els.sendBtn.addEventListener('click', function () {
    var text = els.textInput.value;
    if (text.trim().length === 0) return;
    els.textInput.value = '';
    // Optimistically disable right away -- the 'busy' SSE event confirms it
    // moments later, but this closes the double-tap window in between.
    els.textInput.disabled = true;
    els.sendBtn.disabled = true;
    sendAction(text);
  });
  els.textInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {

  els.stopBtn.addEventListener('click', function () {

  Array.prototype.forEach.call(els.slashMenu.querySelectorAll('button[data-cmd]'), function (btn) {
    btn.addEventListener('click', function () {

  els.retireBtn.addEventListener('click', function () {
    els.slashMenu.classList.add('hidden');

  // ---------------------------------------------------------------- the d20 (signature element)
  //
  // A real regular icosahedron -- not a flat hexagon -- built from 20
  // triangular facets placed in true 3D via CSS `transform-style: preserve-3d`.
  //
  // Aiming each facet's local +Z at its true outward normal is necessary but
  // NOT sufficient: that leaves the triangle's rotation *about* that normal
  // (its roll) unconstrained, so neighbouring facets don't share edges and the
  // solid never closes -- which is what an earlier rotateY/rotateX-only version
  // of this table did, scattering the 20 triangles into a shard pile with a
  // hole through the middle.
  //
  // So each row below is a fully solved orthonormal basis (u, v, n) plus the
  // face centroid g, mapping the div's local clipped triangle exactly onto one
  // real face of the solid:
  //     local (x, y, 0)  ->  g + x*u + y*v          (CSS y points down)
  //     local +Z         ->  n, the outward normal  (so backface culling works)
  // Derived from the 12 vertices (cyclic permutations of (0, +-1, +-phi)) and
  // verified numerically: every facet's 3 corners land on real icosahedron
  // vertices to 1.7e-16, all 20 bases are orthonormal to 2.2e-16 with
  // determinant exactly +1 (proper rotations, no mirrored/culled faces), each
  // vertex is used by exactly 5 faces, and all 30 edges are shared by exactly
  // 2 faces -- i.e. the surface provably closes.
  //
  // The 13th number is a baked Lambertian shade for a fixed upper-left key
  // light, so adjacent facets always differ in value and the silhouette reads
  // as a solid object. (The previous code shaded by array index mod 5, which
  // bears no relation to a face's actual orientation.) The lambert term is
  // taken against the normal in SCREEN space -- i.e. after .die-ring's resting
  // rotateX(-18deg) rotateY(24deg) -- so the highlight lands up-and-left in the
  // pose the player actually reads the result in. Exactly 10 of the 20 faces
  // survive backface culling in that pose, and their shades span 0.50-1.33.
  // A tumbling die carries its lighting with it, which is the usual trade for
  // baked shading and reads fine as facet sparkle at speed.
  var DIE_FACES = [
    [0.309017,-0.809017,0.5,-0.755761,0.110264,0.645497,-0.57735,-0.57735,-0.57735,-0.458794,-0.458794,-0.458794,1.288],
    [1,0,0,0,-0.356822,0.934172,0,-0.934172,-0.356822,0,-0.742344,-0.28355,1.343],
    [-0.809017,-0.5,0.309017,-0.467086,0.866025,0.178411,-0.356822,0,-0.934172,-0.28355,0,-0.742344,0.682],
    [-0.809017,0.5,-0.309017,0.467086,0.866025,0.178411,0.356822,0,-0.934172,0.28355,0,-0.742344,0.5],
    [0.309017,0.809017,-0.5,0.755761,0.110264,0.645497,0.57735,-0.57735,-0.57735,0.458794,-0.458794,-0.458794,0.77],
    [0,0,1,-0.356822,0.934172,0,-0.934172,-0.356822,0,-0.742344,-0.28355,0,1.238],
    [0.5,-0.309017,-0.809017,0.866025,0.178411,0.467086,0,-0.934172,0.356822,0,-0.742344,0.28355,1.326],
    [0.809017,-0.5,0.309017,0.110264,0.645497,0.755761,-0.57735,-0.57735,0.57735,-0.458794,-0.458794,0.458794,1.262],
    [-0.5,0.309017,0.809017,0.645497,0.755761,0.110264,-0.57735,0.57735,-0.57735,-0.458794,0.458794,-0.458794,0.5],
    [-0.309017,-0.809017,0.5,0.178411,0.467086,0.866025,-0.934172,0.356822,0,-0.742344,0.28355,0,0.601],
    [-0.309017,-0.809017,-0.5,0.755761,0.110264,-0.645497,0.57735,-0.57735,0.57735,0.458794,-0.458794,0.458794,0.743],
    [0.809017,0.5,0.309017,-0.467086,0.866025,-0.178411,-0.356822,0,0.934172,-0.28355,0,0.742344,0.639],
    [0.809017,-0.5,-0.309017,0.467086,0.866025,-0.178411,0.356822,0,0.934172,0.28355,0,0.742344,0.5],
    [0.5,0.309017,0.809017,0.866025,-0.178411,-0.467086,0,0.934172,-0.356822,0,0.742344,-0.28355,0.5],
    [-0.809017,-0.5,-0.309017,0.110264,-0.645497,0.755761,-0.57735,0.57735,0.57735,-0.458794,0.458794,0.458794,0.5],
    [-0.5,-0.309017,0.809017,0.866025,-0.178411,0.467086,0,0.934172,0.356822,0,0.742344,0.28355,0.5],
    [-0.5,-0.309017,-0.809017,-0.645497,0.755761,0.110264,0.57735,0.57735,-0.57735,0.458794,0.458794,-0.458794,0.5],
    [0.309017,0.809017,0.5,-0.178411,-0.467086,0.866025,0.934172,-0.356822,0,0.742344,-0.28355,0,0.5],
    [-0.309017,0.809017,-0.5,-0.178411,0.467086,0.866025,0.934172,0.356822,0,0.742344,0.28355,0,0.5],
    [0.309017,-0.809017,0.5,0.755761,-0.110264,-0.645497,0.57735,0.57735,0.57735,0.458794,0.458794,0.458794,0.5]
  ];
  var DIE_EDGE_RATIO = 1.0514622242382672;     // edge length / circumradius

  /** Builds one 3D die (tray + 20 correctly-oriented facets) at the given
   * circumradius in px. Reused for the interactive roll-tray die and for the
   * small idle/decorative dice (brand mark, transition overlay) -- callers
   * apply phase classes (spinning/settled/crit-nat20/crit-nat1) or rely on
   * the .brand-die3d/.transition-die-wrap idle-spin CSS on the WRAPPER this
   * markup is placed into. */
  function d20Svg(radiusPx) {
    var box = DIE_EDGE_RATIO * radiusPx * (2 / Math.sqrt(3));
    var half = box / 2;
    var faces = DIE_FACES.map(function (f) {
      // matrix3d is column-major: cols 1-3 are the images of local x/y/z, col 4
      // the translation. Scaling only the translation keeps the basis a pure
      // rotation, so the facet is never sheared at any die size.
      var m = 'matrix3d(' +
        f[0] + ',' + f[1] + ',' + f[2] + ',0,' +
        f[3] + ',' + f[4] + ',' + f[5] + ',0,' +
        f[6] + ',' + f[7] + ',' + f[8] + ',0,' +
        (f[9] * radiusPx).toFixed(3) + ',' + (f[10] * radiusPx).toFixed(3) + ',' + (f[11] * radiusPx).toFixed(3) + ',1)';
      return '<div class="die-face" style="width:' + box.toFixed(2) + 'px;height:' + box.toFixed(2) + 'px;' +
        'margin-left:-' + half.toFixed(2) + 'px;margin-top:-' + half.toFixed(2) + 'px;' +
        'filter:brightness(' + f[12] + ');transform:' + m + ';"></div>';
    }).join('');
    return '<div class="die-tray" style="perspective:' + Math.round(radiusPx * 9) + 'px;">' +
      '<div class="die-ring">' + faces + '</div>' +
      '<div class="die-crack"></div>' +
      '<div class="die-tray-shadow"></div>' +
      '</div>';
  }

  function parseRawFace(text) {
    if (!text) return null;
    var m = /\[(\d+)\]/.exec(text);
    if (!m) return null;
    var n = parseInt(m[1], 10);
    if (isNaN(n) || n < 1 || n > 20) return null;
    return n;
  }

  var dieSpinTimer = null;

  function startDieSpin() {
    stopDieSpin();
    if (reducedMotion()) return;
    dieSpinTimer = setInterval(function () {
      var node = document.getElementById('d20-number');
      if (!node) { stopDieSpin(); return; }
      node.textContent = String(1 + Math.floor(Math.random() * 20));
    }, 80);
  }

  function stopDieSpin() {
    if (dieSpinTimer) { clearInterval(dieSpinTimer); dieSpinTimer = null; }
  }

  /** One-time population of the purely-decorative dice (brand mark on the
   * PIN/campaigns screens, the loading-overlay spinner) -- these never
   * change phase, so unlike the roll-tray die they're built once and left
   * to their idle-spin CSS animation. */
  function initDecorativeDice() {
    ['brand-die-pin', 'brand-die-campaigns'].forEach(function (id) {
      var node = document.getElementById(id);
      if (node) node.innerHTML = d20Svg(17);
    });
    var tNode = document.getElementById('transition-die');
    if (tNode) tNode.innerHTML = d20Svg(30);
  }

  // ---------------------------------------------------------------- roll bottom sheet

  function renderRollSheet() {
    var request = session && session.pendingRoll;
    if (!request && rollUi.phase === 'idle') {
      els.rollBackdrop.classList.add('hidden');
      return;
    }
    els.rollBackdrop.classList.remove('hidden');
    els.rollSheet.innerHTML = '<i class="corner-mark tl"></i><i class="corner-mark tr"></i><i class="corner-mark bl"></i><i class="corner-mark br"></i>';

    var ctx = request || rollUi.reveal || {};

    if (rollUi.phase === 'waiting' || rollUi.phase === 'rolling') {
      els.rollSheet.appendChild(el('div', 'eyebrow roll-eyebrow', 'The dice decide'));
      els.rollSheet.appendChild(el('div', 'roll-reason', ctx.reason || ''));
      var needText;
      if (ctx.dc !== undefined) needText = 'Need ' + ctx.dc + '+' + (ctx.expr ? ' on ' + ctx.expr : '') + ' to succeed';
      else if (ctx.expr) needText = 'Roll ' + ctx.expr;
      else needText = rollUi.phase === 'rolling' ? 'Fate decides…' : 'Ready when you are';
      els.rollSheet.appendChild(el('div', 'roll-need', needText));

      var wrap = document.createElement('div');
      wrap.id = 'd20-wrap';
      wrap.className = 'd20-wrap ' + (rollUi.phase === 'rolling' ? 'spinning' : 'idle-glow');
      wrap.innerHTML = d20Svg(ROLL_DIE_RADIUS) + '<span class="d20-number" id="d20-number">' + (rollUi.phase === 'rolling' ? '' : '?') + '</span>';
      els.rollSheet.appendChild(wrap);

      var rollBtn = el('button', 'big-btn roll-btn', rollUi.phase === 'rolling' ? 'Rolling…' : 'ROLL');
      rollBtn.disabled = rollUi.phase === 'rolling';
      rollBtn.addEventListener('click', onRollTap);
      els.rollSheet.appendChild(rollBtn);

      if (rollUi.phase === 'rolling') startDieSpin();
      return;
    }

    if (rollUi.phase === 'revealed' && rollUi.reveal) {
      var reveal = rollUi.reveal;
      var activeRoll = reveal.reroll || reveal.first;
      var rawFace = parseRawFace(activeRoll && activeRoll.text);
      var isNat20 = rawFace === 20;
      var isNat1 = rawFace === 1;

      els.rollSheet.appendChild(el('div', 'eyebrow roll-eyebrow', 'The dice have spoken'));
      els.rollSheet.appendChild(el('div', 'roll-reason', reveal.reason));

      var dieState = isNat20 ? 'crit-nat20' : isNat1 ? 'crit-nat1' : 'settled';
      var dieWrap = document.createElement('div');
      dieWrap.className = 'd20-wrap ' + dieState;
      dieWrap.innerHTML = d20Svg(ROLL_DIE_RADIUS) + '<span class="d20-number">' + (rawFace !== null ? rawFace : '') + '</span>';
      els.rollSheet.appendChild(dieWrap);

      if (isNat20) els.rollSheet.appendChild(el('div', 'crit-flourish crit-gold', 'NATURAL 20!'));
      if (isNat1) els.rollSheet.appendChild(el('div', 'crit-flourish crit-crimson', 'NATURAL 1 — FUMBLE'));

      var totalClass = 'roll-total' + (reveal.dc === undefined ? '' : reveal.success ? ' success' : ' failure');
      els.rollSheet.appendChild(el('div', totalClass, String(reveal.keptTotal)));

      if (reveal.dc !== undefined) {
        els.rollSheet.appendChild(el('div', 'roll-outcome ' + (reveal.success ? 'success' : 'failure'), reveal.success ? '✓ SUCCESS' : '✗ FAILURE'));
      }

      var detailText = reveal.reroll
        ? 'Rolled ' + reveal.first.total + ', luck reroll ' + reveal.reroll.total
        : 'Rolled ' + reveal.first.text + ' = ' + reveal.first.total;
      if (reveal.dc !== undefined) detailText += ' — needed ' + reveal.dc + '+';
      els.rollSheet.appendChild(el('div', 'roll-detail', detailText));

      if (reveal.canReroll) {
        var actions = el('div', 'roll-actions');
        var luckBtn = el('button', 'big-btn luck-btn', '✦ ' + reveal.luck + ' — REROLL');
        luckBtn.addEventListener('click', function () { onLuckChoice(true); });
        var acceptBtn = el('button', 'big-btn accept-btn', 'Accept');
        acceptBtn.addEventListener('click', function () { onLuckChoice(false); });
        actions.appendChild(luckBtn);
        actions.appendChild(acceptBtn);
        els.rollSheet.appendChild(actions);
      }
    }
  }

  function onRollTap() {
    clearAutoDismiss();
    rollUi = { phase: 'rolling', reveal: rollUi.reveal };
    renderRollSheet();
    var minWait = reducedMotion() ? 150 : 1300;
    Promise.all([sleep(minWait), postJson('/api/roll/confirm', {})])
      .then(function (results) {
        stopDieSpin();
        showRevealed(results[1].reveal);
      })
      .catch(function () {
        stopDieSpin();
        rollUi = { phase: 'idle', reveal: null };
        renderRollSheet();
      });
  }

  function onLuckChoice(useLuck) {
    if (!useLuck) {
      postJson('/api/roll/resolve', { useLuck: false }).then(function (res) { showRevealed(res.reveal); });
      return;
    }
    clearAutoDismiss();
    rollUi = { phase: 'rolling', reveal: rollUi.reveal };
    renderRollSheet();
    var minWait = reducedMotion() ? 100 : 900;
    Promise.all([sleep(minWait), postJson('/api/roll/resolve', { useLuck: true })])
      .then(function (results) {
        stopDieSpin();
        showRevealed(results[1].reveal);
      })
      .catch(function () {
        stopDieSpin();
        showRevealed(null);
      });
  }

  // ---------------------------------------------------------------- transition overlay

  var transitionTimer = null;

  function showTransitionOverlay(text) {
    els.transitionText.textContent = text;
    els.transitionOverlay.classList.remove('hidden');
    clearTimeout(transitionTimer);
    transitionTimer = setTimeout(function () {
      hideTransitionOverlay();
      if (!(session && session.campaign)) { showScreen('campaigns'); loadCampaigns(); }
    }, 8000);
  }

  function hideTransitionOverlay() {
    clearTimeout(transitionTimer);
    transitionTimer = null;
    els.transitionOverlay.classList.add('hidden');
  }

  // ---------------------------------------------------------------- campaign creation + retire wizard

  var STEP_TITLES = {
    name: 'Campaign Name', hero: 'Hero Name', class: 'Class', race: 'Race', background: 'Background',
    stats: 'Ability Scores', theme: 'World Theme', rating: 'Content Rating', confirm: 'Confirm'
  };

  var STEP_RENDERERS = {
    name: renderStepName, hero: renderStepHero, class: renderStepClass, race: renderStepRace,
    background: renderStepBackground, stats: renderStepStats, theme: renderStepTheme,
    rating: renderStepRating, confirm: renderStepConfirm
  };

  function loadPresets() {
    if (presetsCache) return Promise.resolve(presetsCache);
    return apiFetch('/api/presets').then(function (r) { return r.json(); }).then(function (p) {
      presetsCache = p;
      return p;
    });
  }

  function openWizard(mode) {
    wizard = {
      mode: mode,
      steps: mode === 'new'
        ? ['name', 'hero', 'class', 'race', 'background', 'stats', 'theme', 'rating', 'confirm']
        : ['hero', 'class', 'race', 'background', 'stats', 'confirm'],
      stepIndex: 0,
      data: { name: '', heroName: '', classId: null, race: null, backgroundId: null, themeChoice: null, themeId: null, themeSeed: '', themeCustomText: '', themeLabel: '', contentRating: 'PG-13' },
      presets: null,
      statsMethod: 'standard',
      pools: { standard: null, roll: null },
      assignments: { standard: null, roll: null },
      submitting: false,
    };
    showScreen('wizard');
    els.wizardError.textContent = '';
    els.wizardBody.innerHTML = '';
    els.wizardBody.appendChild(el('div', 'wizard-loading', 'Loading…'));
    loadPresets()
      .then(function (presets) {
        if (!wizard) return; // cancelled while loading
        wizard.presets = presets;
        renderWizardStep();
      })
      .catch(function () {
        els.wizardBody.innerHTML = '';
        els.wizardError.textContent = 'Could not load campaign options — check your connection and try again.';
      });
  }

  function currentStepName() { return wizard.steps[wizard.stepIndex]; }

  function stepTitle(step) {
    if (step === 'confirm') return wizard.mode === 'new' ? 'Confirm & Begin' : 'Confirm New Hero';
    return STEP_TITLES[step] || '';
  }

  function currentKeyStat() {
    if (!wizard.presets || !wizard.data.classId) return 'str';
    var c = wizard.presets.classes.filter(function (x) { return x.id === wizard.data.classId; })[0];
    return c ? c.keyStat.toLowerCase() : 'str';
  }

  function autoAssign(values, keyStat) {
    var idxSorted = values.map(function (v, i) { return i; }).sort(function (a, b) { return values[b] - values[a]; });
    var priority = [keyStat].concat(STAT_ORDER.filter(function (s) { return s !== keyStat; }));
    var byStat = {};
    priority.forEach(function (stat, i) { byStat[stat] = idxSorted[i]; });
    return STAT_ORDER.map(function (stat) { return byStat[stat]; });
  }

  function finalStatArray() {
    var pool = wizard.pools[wizard.statsMethod];
    var assignment = wizard.assignments[wizard.statsMethod];
    return STAT_ORDER.map(function (stat, pos) { return pool[assignment[pos]]; });
  }

  function stepValid(step) {
    switch (step) {
      case 'name': return wizard.data.name.trim().length > 0;
      case 'hero': return wizard.data.heroName.trim().length > 0;
      case 'class': return !!wizard.data.classId;
      case 'race': return !!wizard.data.race;
      case 'background': return true; // optional
      case 'stats': return !!(wizard.pools[wizard.statsMethod] && wizard.assignments[wizard.statsMethod]);
      case 'theme': return !!(wizard.data.themeSeed && wizard.data.themeSeed.trim().length > 0);
      case 'rating': return !!wizard.data.contentRating;
      case 'confirm': return true;
      default: return true;
    }
  }

  function updateNextButton() {
    var step = currentStepName();
    els.wizardNextBtn.disabled = !stepValid(step) || wizard.submitting;
    if (step === 'confirm') {
      els.wizardNextBtn.textContent = wizard.mode === 'new' ? 'Begin Adventure ▶' : 'Retire & Continue ▶';
    } else {
      els.wizardNextBtn.textContent = 'Next ▶';
    }
  }

  function renderWizardStep() {
    var idx = wizard.stepIndex, total = wizard.steps.length;
    // (idx + 1) / total, so the bar says exactly what the label beside it says:
    // on "STEP 1 / 9" it reads 1/9 full, and it only fills completely on the
    // last step. The old idx/(total-1) left step 1 showing a bar at literal
    // zero -- which reads as "nothing has happened yet" on the very screen that
    // announces step one -- and hit 100% while a step still remained.
    els.wizardProgressFill.style.width = Math.round(((idx + 1) / Math.max(1, total)) * 100) + '%';
    els.wizardStepLabel.textContent = 'STEP ' + (idx + 1) + ' / ' + total + ' · ' + stepTitle(currentStepName());
    els.wizardBackBtn.classList.toggle('hidden', idx === 0);
    els.wizardBody.innerHTML = '';
    els.wizardError.textContent = '';
    STEP_RENDERERS[currentStepName()]();
    updateNextButton();
  }

  function goNext() {
    if (!stepValid(currentStepName())) return;
    if (wizard.stepIndex < wizard.steps.length - 1) {
      wizard.stepIndex += 1;
      renderWizardStep();
    }
  }
  function goBack() {
    if (wizard.stepIndex > 0) {
      wizard.stepIndex -= 1;
      renderWizardStep();
    }
  }

  els.wizardBackBtn.addEventListener('click', goBack);
  els.wizardNextBtn.addEventListener('click', function () {
    if (currentStepName() === 'confirm') submitWizard();
    else goNext();
  });
  els.wizardCancelBtn.addEventListener('click', function () {
    var wasRetire = wizard && wizard.mode === 'retire';
    wizard = null;
    if (wasRetire) {
      showScreen('play');
    } else {
      showScreen('campaigns');
      loadCampaigns();
    }
  });

  // ---- step renderers ----

  function renderStepName() {
    var wrap = el('div', 'wizard-step');
    wrap.appendChild(el('div', 'wizard-q', 'What shall we call this campaign?'));
    var input = document.createElement('input');
    input.className = 'wizard-input';
    input.placeholder = 'e.g. The Sunken Spire';
    input.autocomplete = 'off';
    input.value = wizard.data.name;
    input.addEventListener('input', function () { wizard.data.name = input.value; updateNextButton(); });
    wrap.appendChild(input);
    els.wizardBody.appendChild(wrap);
    setTimeout(function () { input.focus(); }, 30);
  }

  function renderStepHero() {
    var wrap = el('div', 'wizard-step');
    if (wizard.mode === 'retire') {
      wrap.appendChild(el('div', 'wizard-intro-note', 'Your current hero steps down. The world, quests, and location carry on with the new hero you build here.'));
    }
    wrap.appendChild(el('div', 'wizard-q', 'Name your hero'));
    var input = document.createElement('input');
    input.className = 'wizard-input';
    input.placeholder = 'e.g. Ariel Duskbane';
    input.autocomplete = 'off';
    input.value = wizard.data.heroName;
    input.addEventListener('input', function () { wizard.data.heroName = input.value; updateNextButton(); });
    wrap.appendChild(input);
    els.wizardBody.appendChild(wrap);
    setTimeout(function () { input.focus(); }, 30);
  }

  function renderStepClass() {
    var wrap = el('div', 'wizard-step');
    wrap.appendChild(el('div', 'wizard-q', 'Pick a class'));
    var list = el('div', 'wizard-card-list');
    wizard.presets.classes.forEach(function (c) {
      var card = el('button', 'wizard-pick-card' + (wizard.data.classId === c.id ? ' selected' : ''));
      card.type = 'button';
      card.appendChild(el('div', 'pick-name', c.name));
      card.appendChild(el('div', 'pick-tagline', c.tagline));
      card.appendChild(el('div', 'pick-meta', 'Base HP ' + c.hitBase + ' · Key stat ' + c.keyStat));
      if (c.kit && c.kit.length) card.appendChild(el('div', 'pick-kit', c.kit.join(' · ')));
      card.addEventListener('click', function () { wizard.data.classId = c.id; renderWizardStep(); });
      list.appendChild(card);
    });
    wrap.appendChild(list);
    els.wizardBody.appendChild(wrap);
  }

  function renderStepRace() {
    var wrap = el('div', 'wizard-step');
    wrap.appendChild(el('div', 'wizard-q', 'Choose a race'));
    var list = el('div', 'wizard-card-list');
    wizard.presets.races.forEach(function (r) {
      var card = el('button', 'wizard-pick-card' + (wizard.data.race === r.id ? ' selected' : ''));
      card.type = 'button';
      card.appendChild(el('div', 'pick-name', r.name));
      card.appendChild(el('div', 'pick-tagline', r.description));
      card.addEventListener('click', function () { wizard.data.race = r.id; renderWizardStep(); });
      list.appendChild(card);
    });
    wrap.appendChild(list);
    els.wizardBody.appendChild(wrap);
  }

  function renderStepBackground() {
    var wrap = el('div', 'wizard-step');
    wrap.appendChild(el('div', 'wizard-q', 'Background'));
    var list = el('div', 'wizard-card-list');
    var noneCard = el('button', 'wizard-pick-card' + (!wizard.data.backgroundId ? ' selected' : ''));
    noneCard.type = 'button';
    noneCard.appendChild(el('div', 'pick-name', 'None'));
    noneCard.appendChild(el('div', 'pick-tagline', 'Skip — no background.'));
    noneCard.addEventListener('click', function () { wizard.data.backgroundId = null; renderWizardStep(); });
    list.appendChild(noneCard);
    wizard.presets.backgrounds.forEach(function (b) {
      var card = el('button', 'wizard-pick-card' + (wizard.data.backgroundId === b.id ? ' selected' : ''));
      card.type = 'button';
      card.appendChild(el('div', 'pick-name', b.name));
      card.appendChild(el('div', 'pick-tagline', b.description));
      card.addEventListener('click', function () { wizard.data.backgroundId = b.id; renderWizardStep(); });
      list.appendChild(card);
    });
    wrap.appendChild(list);
    els.wizardBody.appendChild(wrap);
  }

  function rollNewStats() {
    postJson('/api/roll-stats', {}).then(function (res) {
      if (!wizard) return;
      wizard.pools.roll = res.values;
      wizard.assignments.roll = autoAssign(res.values, currentKeyStat());
      renderWizardStep();
    }).catch(function () {
      els.wizardError.textContent = 'Could not roll stats — try again.';
    });
  }

  function renderStepStats() {
    var wrap = el('div', 'wizard-step');
    wrap.appendChild(el('div', 'wizard-q', 'Assign ability scores'));

    if (!wizard.pools.standard) {
      wizard.pools.standard = wizard.presets.standardArray.slice();
      wizard.assignments.standard = autoAssign(wizard.pools.standard, currentKeyStat());
    }

    var tabs = el('div', 'wizard-tabs');
    var standardTab = el('button', 'wizard-tab' + (wizard.statsMethod === 'standard' ? ' active' : ''), 'Standard Array');
    var rollTab = el('button', 'wizard-tab' + (wizard.statsMethod === 'roll' ? ' active' : ''), 'Roll 4d6');
    standardTab.type = 'button';
    rollTab.type = 'button';
    standardTab.addEventListener('click', function () {
      if (wizard.statsMethod !== 'standard') { wizard.statsMethod = 'standard'; renderWizardStep(); }
    });
    rollTab.addEventListener('click', function () {
      var firstTime = !wizard.pools.roll;
      wizard.statsMethod = 'roll';
      renderWizardStep();
      if (firstTime) rollNewStats();
    });
    tabs.appendChild(standardTab);
    tabs.appendChild(rollTab);
    wrap.appendChild(tabs);

    var pool = wizard.pools[wizard.statsMethod];
    if (wizard.statsMethod === 'roll' && !pool) {
      wrap.appendChild(el('div', 'wizard-loading', 'Rolling the bones…'));
      els.wizardBody.appendChild(wrap);
      return;
    }
    var assignment = wizard.assignments[wizard.statsMethod];

    var baseRow = el('div', 'wizard-pool-row');
    baseRow.appendChild(el('span', 'wizard-pool-label', 'Base'));
    pool.forEach(function (v) { baseRow.appendChild(el('span', 'pool-chip', String(v))); });
    wrap.appendChild(baseRow);

    if (wizard.statsMethod === 'roll') {
      var rerollBtn = el('button', 'wizard-ghost-btn', '⟲ Reroll');
      rerollBtn.type = 'button';
      rerollBtn.addEventListener('click', rollNewStats);
      wrap.appendChild(rerollBtn);
    }

    var keyStat = currentKeyStat();
    var assignWrap = el('div', 'wizard-assign');
    STAT_ORDER.forEach(function (stat, pos) {
      var row = el('div', 'assign-row' + (stat === keyStat ? ' key' : ''));
      row.appendChild(el('span', 'assign-label', stat.toUpperCase() + (stat === keyStat ? ' ★' : '')));
      var select = document.createElement('select');
      select.className = 'assign-select';
      pool.forEach(function (v, pi) {
        var opt = document.createElement('option');
        opt.value = String(pi);
        opt.textContent = String(v);
        if (assignment[pos] === pi) opt.selected = true;
        select.appendChild(opt);
      });
      select.addEventListener('change', function () {
        var newIdx = parseInt(select.value, 10);
        var otherPos = assignment.indexOf(newIdx);
        var oldIdx = assignment[pos];
        assignment[pos] = newIdx;
        if (otherPos !== -1 && otherPos !== pos) assignment[otherPos] = oldIdx;
        renderWizardStep();
      });
      row.appendChild(select);
      assignWrap.appendChild(row);
    });
    wrap.appendChild(assignWrap);

    var finalRow = el('div', 'wizard-final-preview');
    finalRow.appendChild(el('span', 'wizard-pool-label', 'Final'));
    STAT_ORDER.forEach(function (stat, pos) {
      finalRow.appendChild(el('span', 'pool-chip final', stat.toUpperCase() + ' ' + pool[assignment[pos]]));
    });
    wrap.appendChild(finalRow);

    els.wizardBody.appendChild(wrap);
  }

  function renderStepTheme() {
    var wrap = el('div', 'wizard-step');
    wrap.appendChild(el('div', 'wizard-q', "Choose the world's theme"));
    var list = el('div', 'wizard-card-list');
    wizard.presets.themes.forEach(function (t) {
      var card = el('button', 'wizard-pick-card' + (wizard.data.themeChoice === 'preset' && wizard.data.themeId === t.id ? ' selected' : ''));
      card.type = 'button';
      card.appendChild(el('div', 'pick-name', t.label));
      card.addEventListener('click', function () {
        wizard.data.themeChoice = 'preset';
        wizard.data.themeId = t.id;
        wizard.data.themeSeed = t.seed;
        wizard.data.themeLabel = t.label;
        renderWizardStep();
      });
      list.appendChild(card);
    });
    var customCard = el('button', 'wizard-pick-card' + (wizard.data.themeChoice === 'custom' ? ' selected' : ''));
    customCard.type = 'button';
    customCard.appendChild(el('div', 'pick-name', 'Custom…'));
    customCard.appendChild(el('div', 'pick-tagline', 'Describe your own setting'));
    customCard.addEventListener('click', function () {
      wizard.data.themeChoice = 'custom';
      wizard.data.themeId = null;
      wizard.data.themeSeed = wizard.data.themeCustomText;
      wizard.data.themeLabel = 'Custom: ' + wizard.data.themeCustomText;
      renderWizardStep();
    });
    list.appendChild(customCard);
    wrap.appendChild(list);

    if (wizard.data.themeChoice === 'custom') {
      var input = document.createElement('input');
      input.className = 'wizard-input';
      input.placeholder = 'e.g. steampunk pirate archipelago';
      input.autocomplete = 'off';
      input.value = wizard.data.themeCustomText;
      input.addEventListener('input', function () {
        wizard.data.themeCustomText = input.value;
        wizard.data.themeSeed = input.value;
        wizard.data.themeLabel = 'Custom: ' + input.value;
        updateNextButton();
      });
      wrap.appendChild(input);
    }

    els.wizardBody.appendChild(wrap);
  }

  function renderStepRating() {
    var wrap = el('div', 'wizard-step');
    wrap.appendChild(el('div', 'wizard-q', 'Content rating'));
    var list = el('div', 'wizard-rating-list');
    var options = [
      { id: 'PG-13', label: 'PG-13', sub: 'Adventure-first tone; the darkest beats fade to black.' },
      { id: 'R', label: 'R', sub: 'Mature themes and graphic content, played straight.' }
    ];
    options.forEach(function (o) {
      var card = el('button', 'wizard-pick-card rating-card' + (wizard.data.contentRating === o.id ? ' selected' : ''));
      card.type = 'button';
      card.appendChild(el('div', 'pick-name', o.label));
      card.appendChild(el('div', 'pick-tagline', o.sub));
      card.addEventListener('click', function () { wizard.data.contentRating = o.id; renderWizardStep(); });
      list.appendChild(card);
    });
    wrap.appendChild(list);
    els.wizardBody.appendChild(wrap);
  }

  function presetName(kind, id) {
    if (!id || !wizard.presets) return 'None';
    var found = wizard.presets[kind].filter(function (x) { return x.id === id; })[0];
    return found ? found.name : id;
  }

  function renderStepConfirm() {
    var wrap = el('div', 'wizard-step');
    wrap.appendChild(el('div', 'wizard-q', wizard.mode === 'new' ? 'Review your legend' : 'Review your new hero'));
    var list = el('div', 'wizard-summary');
    function row(label, value) {
      var r = el('div', 'summary-row');
      r.appendChild(el('span', 'summary-label', label));
      r.appendChild(el('span', 'summary-value', value));
      list.appendChild(r);
    }
    if (wizard.mode === 'new') row('Campaign', wizard.data.name);
    row('Hero', wizard.data.heroName);
    row('Class', presetName('classes', wizard.data.classId));
    row('Race', presetName('races', wizard.data.race));
    row('Background', wizard.data.backgroundId ? presetName('backgrounds', wizard.data.backgroundId) : 'None');
    var stats = finalStatArray();
    row('Stats', STAT_ORDER.map(function (s, i) { return s.toUpperCase() + ' ' + stats[i]; }).join('  '));
    if (wizard.mode === 'new') {
      row('Theme', wizard.data.themeLabel || wizard.data.themeSeed);
      row('Rating', wizard.data.contentRating);
    }
    wrap.appendChild(list);
    els.wizardBody.appendChild(wrap);
  }

  function submitWizard() {
    if (wizard.submitting) return;
    wizard.submitting = true;
    els.wizardError.textContent = '';
    updateNextButton();

    var statValues = finalStatArray();

    if (wizard.mode === 'new') {
      var body = {
        name: wizard.data.name.trim(),
        heroName: wizard.data.heroName.trim(),
        classId: wizard.data.classId,
        race: wizard.data.race,
        backgroundId: wizard.data.backgroundId || undefined,
        statValues: statValues,
        themeSeed: (wizard.data.themeSeed || '').trim(),
        contentRating: wizard.data.contentRating,
      };
      // A new campaign requires no active session -- always end whatever is
      // live first (a harmless no-op if nothing was running).
      postJson('/api/end', {}).catch(function () {}).then(function () {
        return postJson('/api/new', body);
      }).catch(function () { return null; }).then(function (res) {
        if (!wizard) return; // cancelled mid-flight
        wizard.submitting = false;
        if (!res) { els.wizardError.textContent = 'Network error — try again.'; updateNextButton(); return; }
        if (res.error) { els.wizardError.textContent = res.error; updateNextButton(); return; }
        onWizardSuccess('Forging your legend…');
      });
    } else {
      var body2 = {
        heroName: wizard.data.heroName.trim(),
        classId: wizard.data.classId,
        race: wizard.data.race,
        backgroundId: wizard.data.backgroundId || undefined,
        statValues: statValues,
      };
      postJson('/api/retire', body2).catch(function () { return null; }).then(function (res) {
        if (!wizard) return;
        wizard.submitting = false;
        if (!res) { els.wizardError.textContent = 'Network error — try again.'; updateNextButton(); return; }
        if (res.error) { els.wizardError.textContent = res.error; updateNextButton(); return; }
        onWizardSuccess('A new hero rises…');
      });
    }
  }

  function onWizardSuccess(message) {
    wizard = null;
    showTransitionOverlay(message);
    // The server calls broadcastHello() right after starting the new/retired
    // session, so the 'hello' SSE handler will navigate to the play screen
    // and hideTransitionOverlay() itself once that arrives.
  }

  // ---------------------------------------------------------------- boot

  /**
   * Shapes the single login field for whatever the server actually wants. The
   * PIN treatment is a 6-cell numeric input, which physically cannot accept a
   * 29-character access code, so this has to run before the player can type.
   * Unauthenticated endpoint (it only reports which mode we're in), and any
   * failure leaves the PIN default -- the safe assumption, since a server with
   * no players registered is exactly the PIN case.
   */
  function applyAuthMode() {
    var input = els.pinInput;
    // Code mode is the assumed default (see the input's markup comment), so it
    // is styled first and only downgraded to the PIN treatment on confirmation.
    input.classList.add('code-mode');
    input.setAttribute('maxlength', '48');
    input.placeholder = 'xxxx-xxxx-xxxx-xxxx-xxxx-xxxx';

    return fetch('/api/auth-mode')
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (body) {
        if (!body) return;
        if (body.mode === 'pin') {
          input.classList.remove('code-mode');
          input.setAttribute('inputmode', 'numeric');
          input.setAttribute('pattern', '[0-9]*');
          input.setAttribute('maxlength', '6');
          input.placeholder = '000000';
          els.pinSubtitle.textContent = "Enter the 6-digit PIN shown in your server's terminal.";
          authMode = 'pin';
          return;
        }
        els.pinSubtitle.textContent = 'Enter your access code. Ask whoever runs the server if you need one.';
        authMode = 'code';
      })
      .catch(function () {
        // Unreachable server: stay permissive. A code can still be typed, and a
        // PIN is a valid string in a permissive field anyway.
        els.pinSubtitle.textContent = 'Enter your access code or PIN.';
      });
  }

  function boot() {
    applyAuthMode();
    if (!pin) { showScreen('pin'); return; }
    apiFetch('/api/campaigns')
      .then(function (res) {
        if (!res.ok) throw new Error('unexpected');
        return res.json();
      })
      .then(function (list) {
        // Explicit, not left to the SSE hello race: without this the page
        // stayed blank until (and unless) the hello event happened to arrive.
        showScreen('campaigns');
        renderCampaignList(list);
        connectSse();
      })
      .catch(function () {
        // apiFetch already routed to the PIN screen on 401; anything else
        // (server unreachable) just leaves the PIN screen as the safe default.
        if (currentScreen === null) showScreen('pin');
      });
  }

  els.pinInput.value = '';
  initDecorativeDice();
  boot();
})();
</script>
</body>
</html>
