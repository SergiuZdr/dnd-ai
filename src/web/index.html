<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="color-scheme" content="dark" />
<title>AI Dungeon Master</title>
<style>
  :root {
    --bg: #12141a;
    --panel: #1a1d26;
    --panel-2: #232734;
    --border: #313648;
    --text: #e8eaf2;
    --dim: #8b90a6;
    --accent: #7c9dff;
    --green: #4ade80;
    --red: #f87171;
    --yellow: #facc15;
    --luck: #d9a4ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior-y: contain;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  #app { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  .hidden { display: none !important; }
  .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  /* ---- centered form screens (PIN + campaign list) ---- */
  .centered { align-items: center; justify-content: center; padding: 24px; text-align: center; gap: 16px; }
  .brand { font-size: 1.5rem; font-weight: 700; }
  .brand .dice { margin-right: 6px; }
  .subtitle { color: var(--dim); font-size: 0.95rem; max-width: 320px; }
  #pin-input {
    width: 220px; text-align: center; letter-spacing: 0.5em; font-size: 1.6rem;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 0 14px 0.5em; color: var(--text);
  }
  .big-btn {
    background: var(--accent); color: #0d1020; border: none; border-radius: 12px;
    padding: 14px 28px; font-size: 1.05rem; font-weight: 600; min-width: 180px;
  }
  .big-btn:active { opacity: 0.8; }
  .error-text { color: var(--red); font-size: 0.9rem; min-height: 1.2em; }

  /* ---- campaigns list ---- */
  #screen-campaigns { padding: calc(16px + env(safe-area-inset-top)) 16px 16px; overflow-y: auto; }
  .campaign-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; margin-bottom: 10px; text-align: left; width: 100%; display: block;
  }
  .campaign-card .name { font-weight: 600; font-size: 1.05rem; }
  .campaign-card .meta { color: var(--dim); font-size: 0.85rem; margin-top: 4px; }
  .empty-note { color: var(--dim); padding: 24px; text-align: center; }

  /* ---- play screen ---- */
  #screen-play { position: relative; }
  .topbar {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
  }
  .topbar-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .topbar-name { font-weight: 700; margin-right: auto; }
  .hpbar { width: 70px; height: 8px; border-radius: 5px; background: #2a2e3b; overflow: hidden; }
  .hpbar-fill { height: 100%; background: var(--green); transition: width 0.25s, background 0.25s; }
  .stat-chip { font-size: 0.82rem; color: var(--dim); white-space: nowrap; }
  .stat-chip b { color: var(--text); }
  .luck-chip { color: var(--luck); }

  .drawer {
    background: var(--panel-2); border-bottom: 1px solid var(--border);
    padding: 12px 16px; max-height: 40vh; overflow-y: auto; font-size: 0.9rem;
  }
  .drawer h4 { margin: 10px 0 4px; color: var(--dim); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .drawer .row { display: flex; justify-content: space-between; padding: 2px 0; }

  .reconnect-pill {
    position: absolute; top: calc(8px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    background: var(--yellow); color: #241d00; font-size: 0.8rem; font-weight: 600;
    padding: 4px 12px; border-radius: 999px; z-index: 20;
  }

  .feed { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
  .entry { max-width: 88%; padding: 10px 13px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .entry-dm { background: var(--panel); align-self: flex-start; border-bottom-left-radius: 4px; }
  .entry-player { background: var(--accent); color: #0d1020; align-self: flex-end; border-bottom-right-radius: 4px; }
  .entry-system { background: transparent; color: var(--dim); font-style: italic; align-self: center; text-align: center; font-size: 0.85rem; max-width: 95%; }
  .entry-streaming { background: var(--panel); align-self: flex-start; border-bottom-left-radius: 4px; position: relative; }
  .entry-streaming::after {
    content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); margin-left: 4px; animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

  .dice-line { padding: 4px 16px; min-height: 1.3em; font-size: 0.85rem; color: var(--yellow); }

  .input-row { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--panel); }
  #text-input {
    flex: 1; background: var(--panel-2); border: 1px solid var(--border); border-radius: 20px;
    padding: 10px 16px; color: var(--text); min-width: 0;
  }
  #text-input:disabled { opacity: 0.5; }
  .round-btn { background: var(--panel-2); border: 1px solid var(--border); border-radius: 20px; padding: 10px 16px; }
  #send-btn { background: var(--accent); color: #0d1020; font-weight: 600; border: none; }
  #send-btn:disabled { opacity: 0.4; }
  #stop-btn { background: var(--red); color: #250909; border: none; font-weight: 600; }

  .slash-menu { display: flex; gap: 8px; padding: 0 12px 10px; background: var(--panel); flex-wrap: wrap; }
  .slash-menu button { background: var(--panel-2); border: 1px solid var(--border); border-radius: 14px; padding: 8px 12px; font-size: 0.85rem; }

  /* ---- roll bottom sheet ---- */
  .sheet-backdrop {
    position: absolute; inset: 0; background: rgba(0,0,0,0.5); z-index: 30;
    display: flex; align-items: flex-end;
  }
  .roll-sheet {
    width: 100%; background: var(--panel); border-top: 1px solid var(--border);
    border-radius: 20px 20px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    text-align: center;
  }
  .roll-reason { font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; }
  .roll-need { color: var(--dim); margin-bottom: 18px; }
  .die-face { font-size: 3rem; margin-bottom: 14px; display: inline-block; }
  @keyframes tumble {
    0% { transform: rotate(0deg) scale(1); }
    25% { transform: rotate(100deg) scale(1.2); }
    50% { transform: rotate(190deg) scale(0.9); }
    75% { transform: rotate(280deg) scale(1.2); }
    100% { transform: rotate(360deg) scale(1); }
  }
  .die-tumble { animation: tumble 0.7s ease-in-out; }
  .roll-total { font-size: 2.4rem; font-weight: 800; margin-bottom: 4px; }
  .roll-total.success { color: var(--green); }
  .roll-total.failure { color: var(--red); }
  .roll-detail { color: var(--dim); font-size: 0.9rem; margin-bottom: 18px; }
  .roll-actions { display: flex; gap: 10px; }
  .roll-actions .big-btn { flex: 1; }
  .luck-btn { background: var(--luck); color: #240a33; }
  .accept-btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); }
</style>
</head>
<body>
<div id="app">

  <div id="screen-pin" class="screen centered hidden">
    <div class="brand"><span class="dice">🎲</span>AI Dungeon Master</div>
    <div class="subtitle">Enter the 6-digit PIN shown in your server's terminal.</div>
    <input id="pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" autocomplete="off" />
    <button id="pin-submit" class="big-btn">Continue</button>
    <div class="error-text" id="pin-error"></div>
  </div>

  <div id="screen-campaigns" class="screen hidden">
    <div class="brand" style="margin-bottom: 16px;"><span class="dice">🎲</span>Campaigns</div>
    <div id="campaign-list"></div>
  </div>

  <div id="screen-play" class="screen hidden">
    <div class="topbar">
      <div class="topbar-row" id="topbar-toggle" role="button">
        <span class="topbar-name" id="tb-name"></span>
        <div class="hpbar"><div class="hpbar-fill" id="tb-hpfill"></div></div>
        <span class="stat-chip" id="tb-hp"></span>
        <span class="stat-chip" id="tb-ac"></span>
        <span class="stat-chip" id="tb-gold"></span>
        <span class="stat-chip luck-chip" id="tb-luck"></span>
        <span class="stat-chip" id="tb-xp"></span>
      </div>
    </div>
    <div class="drawer hidden" id="drawer"></div>

    <div class="reconnect-pill hidden" id="reconnect-pill">reconnecting…</div>

    <div class="feed" id="feed"></div>
    <div class="dice-line" id="dice-line"></div>

    <div class="slash-menu hidden" id="slash-menu">
      <button data-cmd="/help">Help</button>
      <button data-cmd="/sheet">Sheet</button>
      <button data-cmd="/journal">Journal</button>
      <button data-cmd="/save">Save</button>
    </div>
    <div class="input-row">
      <button class="round-btn" id="slash-btn">/</button>
      <input id="text-input" placeholder="What do you do?" autocomplete="off" />
      <button id="send-btn" class="round-btn">Send</button>
      <button id="stop-btn" class="round-btn hidden">Stop</button>
    </div>

    <div class="sheet-backdrop hidden" id="roll-backdrop">
      <div class="roll-sheet" id="roll-sheet"></div>
    </div>
  </div>

</div>
<script>
(function () {
  'use strict';

  var PIN_KEY = 'dnd-web-pin';
  var DIE_FACES = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

  var els = {
    pinScreen: document.getElementById('screen-pin'),
    campaignsScreen: document.getElementById('screen-campaigns'),
    playScreen: document.getElementById('screen-play'),
    pinInput: document.getElementById('pin-input'),
    pinSubmit: document.getElementById('pin-submit'),
    pinError: document.getElementById('pin-error'),
    campaignList: document.getElementById('campaign-list'),
    topbarToggle: document.getElementById('topbar-toggle'),
    tbName: document.getElementById('tb-name'),
    tbHpFill: document.getElementById('tb-hpfill'),
    tbHp: document.getElementById('tb-hp'),
    tbAc: document.getElementById('tb-ac'),
    tbGold: document.getElementById('tb-gold'),
    tbLuck: document.getElementById('tb-luck'),
    tbXp: document.getElementById('tb-xp'),
    drawer: document.getElementById('drawer'),
    reconnectPill: document.getElementById('reconnect-pill'),
    feed: document.getElementById('feed'),
    diceLine: document.getElementById('dice-line'),
    slashBtn: document.getElementById('slash-btn'),
    slashMenu: document.getElementById('slash-menu'),
    textInput: document.getElementById('text-input'),
    sendBtn: document.getElementById('send-btn'),
    stopBtn: document.getElementById('stop-btn'),
    rollBackdrop: document.getElementById('roll-backdrop'),
    rollSheet: document.getElementById('roll-sheet'),
  };

  var pin = localStorage.getItem(PIN_KEY) || '';
  var currentScreen = null;
  var session = null; // last 'hello' snapshot, kept up to date by every subsequent event
  var partial = '';
  var evtSource = null;
  var drawerOpen = false;
  var rollUi = { phase: 'idle', reveal: null }; // 'idle' | 'waiting' | 'rolling' | 'revealed'
  var localNoteCounter = 0; // client-only ids for 'note' events, mirrors the server's own negative-id scheme

  // ---------------------------------------------------------------- utils

  function sleep(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function showScreen(name) {
    currentScreen = name;
    els.pinScreen.classList.toggle('hidden', name !== 'pin');
    els.campaignsScreen.classList.toggle('hidden', name !== 'campaigns');
    els.playScreen.classList.toggle('hidden', name !== 'play');
  }

  /** Every request except GET / goes through here: attaches the PIN header, and on 401 clears the stored PIN and bounces to the PIN screen (never assumes success past that point -- callers should stop on a thrown error). */
  function apiFetch(path, options) {
    options = options || {};
    var headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
    headers['X-Game-Pin'] = pin;
    return fetch(path, Object.assign({}, options, { headers: headers })).then(function (res) {
      if (res.status === 401) {
        localStorage.removeItem(PIN_KEY);
        pin = '';
        showScreen('pin');
        els.pinError.textContent = 'Wrong PIN — try again.';
        throw new Error('unauthorized');
      }
      return res;
    });
  }

  function postJson(path, body) {
    return apiFetch(path, { method: 'POST', body: JSON.stringify(body || {}) }).then(function (res) {
      return res.json();
    });
  }

  // ---------------------------------------------------------------- PIN screen

  els.pinInput.addEventListener('input', function () {
    els.pinInput.value = els.pinInput.value.replace(/\D/g, '').slice(0, 6);
  });
  els.pinInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') submitPin();
  });
  els.pinSubmit.addEventListener('click', submitPin);

  function submitPin() {
    var candidate = els.pinInput.value.trim();
    if (candidate.length === 0) return;
    pin = candidate;
    els.pinError.textContent = '';
    apiFetch('/api/campaigns')
      .then(function (res) {
        if (!res.ok) throw new Error('unexpected');
        localStorage.setItem(PIN_KEY, pin);
        return res.json();
      })
      .then(function (list) {
        renderCampaignList(list);
        connectSse();
      })
      .catch(function () {
        // apiFetch already redirected to the PIN screen with an error on 401;
        // anything else, leave the field as-is so the player can retry.
      });
  }

  // ---------------------------------------------------------------- campaigns screen

  function renderCampaignList(list) {
    els.campaignList.innerHTML = '';
    if (!list || list.length === 0) {
      els.campaignList.appendChild(el('div', 'empty-note', 'No campaigns yet — create one in the terminal app first (npm run play), then come back here to continue it.'));
      return;
    }
    list.forEach(function (c) {
      var card = el('button', 'campaign-card');
      card.appendChild(el('div', 'name', c.name));
      card.appendChild(el('div', 'meta', 'Updated ' + relativeTime(c.updatedAt)));
      card.addEventListener('click', function () { continueCampaign(c.slug); });
      els.campaignList.appendChild(card);
    });
  }

  function relativeTime(iso) {
    var diffMs = Date.now() - new Date(iso).getTime();
    var mins = Math.round(diffMs / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    var hours = Math.round(mins / 60);
    if (hours < 24) return hours + 'h ago';
    return Math.round(hours / 24) + 'd ago';
  }

  function continueCampaign(slug) {
    postJson('/api/continue', { slug: slug })
      .catch(function () { return null; }) // 409 (already running) is fine -- just attach via SSE below
      .then(function () {
        showScreen('play');
      });
  }

  // ---------------------------------------------------------------- SSE

  function connectSse() {
    if (evtSource) evtSource.close();
    evtSource = new EventSource('/api/events?pin=' + encodeURIComponent(pin));

    evtSource.addEventListener('open', function () {
      els.reconnectPill.classList.add('hidden');
    });
    evtSource.onerror = function () {
      els.reconnectPill.classList.remove('hidden');
    };

    evtSource.addEventListener('hello', function (e) {
      session = JSON.parse(e.data);
      partial = '';
      clearAutoDismiss();
      rollUi = { phase: session.pendingRoll ? 'waiting' : 'idle', reveal: null };
      if (session.campaign) {
        showScreen('play');
      } else if (currentScreen !== 'pin') {
        showScreen('campaigns');
        loadCampaigns();
      }
      renderFeed(true);
      renderTopbar();
      renderDiceLine();
      renderRollSheet();
      renderInputState();
    });

    evtSource.addEventListener('story', function (e) {
      var entry = JSON.parse(e.data);
      session.entries.push(entry);
      appendFeedEntry(entry);
      autoScroll(entry.kind === 'player');
    });

    evtSource.addEventListener('replay', function (e) {
      var data = JSON.parse(e.data);
      session.entries = session.entries.concat(data.entries);
      renderFeed(true);
    });

    evtSource.addEventListener('stream', function (e) {
      var data = JSON.parse(e.data);
      var wasEmpty = partial.length === 0;
      partial = data.text;
      renderStreamingBubble();
      if (wasEmpty && partial.length > 0) autoScroll(true);
      else autoScroll(false);
    });

    evtSource.addEventListener('state', function (e) {
      session.state = JSON.parse(e.data);
      renderTopbar();
    });

    evtSource.addEventListener('dice', function (e) {
      session.diceMessage = JSON.parse(e.data).message;
      renderDiceLine();
    });

    evtSource.addEventListener('busy', function (e) {
      session.busy = JSON.parse(e.data).busy;
      renderInputState();
    });

    evtSource.addEventListener('note', function (e) {
      var text = JSON.parse(e.data).text;
      localNoteCounter -= 1;
      appendFeedEntry({ id: 'note-' + localNoteCounter, kind: 'system', text: text });
      autoScroll(false);
    });

    // NOTE on ordering: confirmRoll()/resolvePendingRoll() broadcast this
    // event (data: null) SYNCHRONOUSLY as part of resolving the roll --
    // which can race ahead of, or arrive right alongside, the POST response
    // that carries the actual reveal (onRollTap/onLuckChoice below). This
    // handler must never let that race yank the sheet away before the
    // player has had a chance to read a reveal that's either already
    // showing or about to be shown by that POST's own .then(). See
    // showRevealed()/scheduleAutoDismiss() for the other half of this.
    evtSource.addEventListener('roll', function (e) {
      var request = JSON.parse(e.data);
      session.pendingRoll = request;
      if (request) {
        clearAutoDismiss();
        rollUi = { phase: 'waiting', reveal: null };
        renderRollSheet();
      } else if (rollUi.phase === 'rolling') {
        // Mid-animation, no reveal shown yet -- do nothing here. The local
        // sleep(700)/POST chain in onRollTap will call showRevealed() itself
        // once it lands, and THAT will notice pendingRoll is already null
        // and schedule the dismiss then.
      } else if (rollUi.phase === 'revealed') {
        scheduleAutoDismiss();
      } else {
        // Nothing was ever shown locally for this roll (e.g. another device
        // resolved it, or the session errored/interrupted before the
        // player even tapped ROLL) -- nothing to linger on.
        clearAutoDismiss();
        rollUi = { phase: 'idle', reveal: null };
        renderRollSheet();
      }
      renderInputState();
    });
  }

  var autoDismissTimer = null;
  var AUTO_DISMISS_MS = 1600;

  function clearAutoDismiss() {
    if (autoDismissTimer) {
      clearTimeout(autoDismissTimer);
      autoDismissTimer = null;
    }
  }

  /** Lets an already-rendered reveal stay on screen briefly before the sheet closes on its own -- see the 'roll' SSE handler above for why this exists instead of closing immediately. */
  function scheduleAutoDismiss() {
    clearAutoDismiss();
    autoDismissTimer = setTimeout(function () {
      autoDismissTimer = null;
      if (!session.pendingRoll) {
        rollUi = { phase: 'idle', reveal: null };
        renderRollSheet();
      }
    }, AUTO_DISMISS_MS);
  }

  /** Single path for both onRollTap and onLuckChoice to show a reveal from a POST response -- keeps the "schedule a dismiss once we know the server has already resolved" logic in one place. */
  function showRevealed(reveal) {
    if (!reveal) {
      // The server had nothing to reveal (e.g. the roll was aborted from
      // under us while the local animation/request was in flight) -- there
      // is nothing to show, so don't leave a blank sheet lingering.
      rollUi = { phase: 'idle', reveal: null };
      renderRollSheet();
      return;
    }
    rollUi = { phase: 'revealed', reveal: reveal };
    renderRollSheet();
    if (!session.pendingRoll) scheduleAutoDismiss();
  }

  function loadCampaigns() {
    apiFetch('/api/campaigns')
      .then(function (res) { return res.json(); })
      .then(renderCampaignList)
      .catch(function () {});
  }

  // ---------------------------------------------------------------- feed rendering

  function isNearBottom() {
    var f = els.feed;
    return f.scrollHeight - f.scrollTop - f.clientHeight < 100;
  }

  function autoScroll(force) {
    if (!force && !isNearBottom()) return;
    requestAnimationFrame(function () { els.feed.scrollTop = els.feed.scrollHeight; });
  }

  function entryClass(kind) {
    if (kind === 'player') return 'entry entry-player';
    if (kind === 'system') return 'entry entry-system';
    return 'entry entry-dm';
  }

  function appendFeedEntry(entry) {
    var node = el('div', entryClass(entry.kind), entry.text);
    node.dataset.id = String(entry.id);
    els.feed.appendChild(node);
  }

  function renderFeed(snapToBottom) {
    els.feed.innerHTML = '';
    (session.entries || []).forEach(appendFeedEntry);
    renderStreamingBubble();
    if (snapToBottom) autoScroll(true);
  }

  function renderStreamingBubble() {
    var existing = document.getElementById('streaming-bubble');
    if (existing) existing.remove();
    if (partial.length === 0) return;
    var node = el('div', 'entry entry-streaming', partial);
    node.id = 'streaming-bubble';
    els.feed.appendChild(node);
  }

  // ---------------------------------------------------------------- top bar + drawer

  function renderTopbar() {
    if (!session || !session.state) return;
    var c = session.state.character;
    var w = session.state.world;
    var ratio = c.maxHp > 0 ? Math.max(0, Math.min(1, c.hp / c.maxHp)) : 0;
    els.tbName.textContent = c.name;
    els.tbHpFill.style.width = Math.round(ratio * 100) + '%';
    els.tbHpFill.style.background = ratio > 0.5 ? 'var(--green)' : ratio > 0.25 ? 'var(--yellow)' : 'var(--red)';
    els.tbHp.innerHTML = 'HP <b>' + c.hp + '/' + c.maxHp + '</b>';
    els.tbAc.innerHTML = 'AC <b>' + c.ac + '</b>';
    els.tbGold.innerHTML = 'Gold <b>' + c.gold + '</b>';
    els.tbLuck.innerHTML = '✦ <b>' + c.luck + '</b>';
    els.tbXp.innerHTML = 'XP <b>' + c.xp + '</b>';
    if (drawerOpen) renderDrawer();
  }

  function renderDrawer() {
    if (!session || !session.state) return;
    var c = session.state.character;
    var w = session.state.world;
    els.drawer.innerHTML = '';

    els.drawer.appendChild(el('h4', null, c.race + ' ' + c.className + ' — Level ' + c.level + (c.background ? ' — ' + c.background : '')));
    var stats = el('div', 'row');
    stats.textContent = 'STR ' + c.stats.str + '  DEX ' + c.stats.dex + '  CON ' + c.stats.con + '  INT ' + c.stats.int + '  WIS ' + c.stats.wis + '  CHA ' + c.stats.cha;
    els.drawer.appendChild(stats);

    els.drawer.appendChild(el('h4', null, 'Inventory'));
    if (c.inventory.length === 0) {
      els.drawer.appendChild(el('div', 'row', '(empty)'));
    } else {
      c.inventory.forEach(function (item) {
        els.drawer.appendChild(el('div', 'row', item.name + ' ×' + item.qty));
      });
    }

    els.drawer.appendChild(el('h4', null, 'Quests'));
    var active = w.quests.filter(function (q) { return q.status === 'active'; });
    if (active.length === 0) {
      els.drawer.appendChild(el('div', 'row', '(none active)'));
    } else {
      active.forEach(function (q) { els.drawer.appendChild(el('div', 'row', '◆ ' + q.title)); });
    }

    els.drawer.appendChild(el('h4', null, 'Location'));
    els.drawer.appendChild(el('div', 'row', '📍 ' + w.location));
  }

  els.topbarToggle.addEventListener('click', function () {
    drawerOpen = !drawerOpen;
    els.drawer.classList.toggle('hidden', !drawerOpen);
    if (drawerOpen) renderDrawer();
  });

  // ---------------------------------------------------------------- dice line (idle, non-interactive rolls)

  function renderDiceLine() {
    els.diceLine.textContent = (session && session.diceMessage) || '';
  }

  // ---------------------------------------------------------------- input bar

  // Stop replaces Send only once the DM turn is actually under way (busy,
  // not just a pending roll) -- while a roll card is up, Stop is hidden
  // entirely (mirrors the TUI: Esc must never interrupt a pending roll).
  function renderInputState() {
    var busy = !!(session && session.busy);
    var rolling = !!(session && session.pendingRoll);
    els.textInput.disabled = busy || rolling;
    els.sendBtn.disabled = busy || rolling;
    var showStop = busy && !rolling;
    els.stopBtn.classList.toggle('hidden', !showStop);
    els.sendBtn.classList.toggle('hidden', showStop);
  }

  function sendAction(text) {
    var trimmed = (text || '').trim();
    if (trimmed.length === 0) return;
    // No optimistic local echo: submitPlayerAction() appends the player's
    // own StoryEntry (and broadcasts it) synchronously server-side, so the
    // real 'story' event round-trips almost instantly on a LAN -- rendering
    // a local placeholder first would just risk showing the line twice.
    postJson('/api/action', { text: trimmed }).catch(function () {
      renderInputState(); // resync to the last known state if the request itself failed
    });
  }

  els.sendBtn.addEventListener('click', function () {
    var text = els.textInput.value;
    if (text.trim().length === 0) return;
    els.textInput.value = '';
    // Optimistically disable right away -- the 'busy' SSE event confirms it
    // moments later, but this closes the double-tap window in between.
    els.textInput.disabled = true;
    els.sendBtn.disabled = true;
    sendAction(text);
  });
  els.textInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      els.sendBtn.click();
    }
  });
  els.stopBtn.addEventListener('click', function () {
    apiFetch('/api/interrupt', { method: 'POST' }).catch(function () {});
  });

  els.slashBtn.addEventListener('click', function () {
    els.slashMenu.classList.toggle('hidden');
  });
  Array.prototype.forEach.call(els.slashMenu.querySelectorAll('button'), function (btn) {
    btn.addEventListener('click', function () {
      els.slashMenu.classList.add('hidden');
      sendAction(btn.dataset.cmd);
    });
  });

  // ---------------------------------------------------------------- roll bottom sheet

  function renderRollSheet() {
    var request = session && session.pendingRoll;
    if (!request && rollUi.phase === 'idle') {
      els.rollBackdrop.classList.add('hidden');
      return;
    }
    els.rollBackdrop.classList.remove('hidden');
    els.rollSheet.innerHTML = '';

    if (rollUi.phase === 'waiting' || rollUi.phase === 'rolling') {
      els.rollSheet.appendChild(el('div', 'roll-reason', '🎲 ' + (request ? request.reason : '')));
      var needText = request && request.dc !== undefined
        ? 'Need ' + request.dc + '+ on ' + request.expr + ' to succeed'
        : 'Roll ' + (request ? request.expr : '');
      els.rollSheet.appendChild(el('div', 'roll-need', needText));
      var face = el('div', 'die-face' + (rollUi.phase === 'rolling' ? ' die-tumble' : ''), rollUi.phase === 'rolling' ? DIE_FACES[Math.floor(Math.random() * DIE_FACES.length)] : '🎲');
      face.id = 'die-face';
      els.rollSheet.appendChild(face);
      var rollBtn = el('button', 'big-btn', rollUi.phase === 'rolling' ? 'Rolling…' : 'ROLL');
      rollBtn.disabled = rollUi.phase === 'rolling';
      rollBtn.addEventListener('click', onRollTap);
      els.rollSheet.appendChild(rollBtn);
      if (rollUi.phase === 'rolling') animateTumble();
      return;
    }

    if (rollUi.phase === 'revealed' && rollUi.reveal) {
      var reveal = rollUi.reveal;
      els.rollSheet.appendChild(el('div', 'roll-reason', '🎲 ' + reveal.reason));
      var totalClass = 'roll-total' + (reveal.dc === undefined ? '' : reveal.success ? ' success' : ' failure');
      els.rollSheet.appendChild(el('div', totalClass, String(reveal.keptTotal)));
      var detailText = reveal.reroll
        ? 'Rolled ' + reveal.first.total + ', luck reroll ' + reveal.reroll.total
        : 'Rolled ' + reveal.first.text + ' = ' + reveal.first.total;
      if (reveal.dc !== undefined) {
        detailText += ' — needed ' + reveal.dc + '+' + (reveal.success ? ' → ✓ SUCCESS' : ' → ✗ FAILURE');
      }
      els.rollSheet.appendChild(el('div', 'roll-detail', detailText));

      if (reveal.canReroll) {
        var actions = el('div', 'roll-actions');
        var luckBtn = el('button', 'big-btn luck-btn', '✦ ' + reveal.luck + ' — REROLL');
        luckBtn.addEventListener('click', function () { onLuckChoice(true); });
        var acceptBtn = el('button', 'big-btn accept-btn', 'Accept');
        acceptBtn.addEventListener('click', function () { onLuckChoice(false); });
        actions.appendChild(luckBtn);
        actions.appendChild(acceptBtn);
        els.rollSheet.appendChild(actions);
      }
    }
  }

  function animateTumble() {
    var face = document.getElementById('die-face');
    if (!face) return;
    var i = setInterval(function () {
      var node = document.getElementById('die-face');
      if (!node) { clearInterval(i); return; }
      node.textContent = DIE_FACES[Math.floor(Math.random() * DIE_FACES.length)];
    }, 90);
    setTimeout(function () { clearInterval(i); }, 700);
  }

  function onRollTap() {
    clearAutoDismiss();
    rollUi = { phase: 'rolling', reveal: null };
    renderRollSheet();
    sleep(700)
      .then(function () { return postJson('/api/roll/confirm', {}); })
      .then(function (res) { showRevealed(res.reveal); });
  }

  function onLuckChoice(useLuck) {
    postJson('/api/roll/resolve', { useLuck: useLuck }).then(function (res) {
      showRevealed(res.reveal);
    });
  }

  // ---------------------------------------------------------------- boot

  function boot() {
    if (!pin) { showScreen('pin'); return; }
    apiFetch('/api/campaigns')
      .then(function (res) {
        if (!res.ok) throw new Error('unexpected');
        return res.json();
      })
      .then(function (list) {
        renderCampaignList(list);
        connectSse();
      })
      .catch(function () {
        // apiFetch already routed to the PIN screen on 401; anything else
        // (server unreachable) just leaves the PIN screen as the safe default.
        if (currentScreen === null) showScreen('pin');
      });
  }

  els.pinInput.value = '';
  boot();
})();
</script>
</body>
</html>
